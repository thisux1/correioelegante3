name: CI

# CI/CD desativado para execuções automáticas (ativado apenas via disparo manual)
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend — lint, typecheck, test & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: backend
        run: npm ci

      - name: Gerar cliente Prisma
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: mongodb://localhost:27017/ci_placeholder

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Rodar testes
        working-directory: backend
        run: npm test
        env:
          JWT_SECRET: ci-jwt-secret-32-chars-minimum!!
          JWT_REFRESH_SECRET: ci-refresh-secret-32-chars-min!!
          NODE_ENV: test

      - name: Build TypeScript
        working-directory: backend
        run: npm run build

      - name: Auditoria de dependências
        working-directory: backend
        run: npm audit --audit-level=high --omit=dev

  frontend:
    name: Frontend — lint, typecheck, test & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Testes
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Auditoria de dependências
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

  my-video:
    name: My Video — lint & typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-video/package-lock.json

      - name: Instalar dependências
        working-directory: my-video
        run: npm ci

      - name: Lint
        working-directory: my-video
        run: npm run lint

      - name: Typecheck
        working-directory: my-video
        run: npm run typecheck

      - name: Auditoria de dependências
        working-directory: my-video
        run: npm audit --audit-level=high --omit=dev
