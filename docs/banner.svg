<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300">
  <defs>
    <pattern id="ce3-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.9" fill="#e11d48" opacity="0.07"/>
    </pattern>
    <filter id="ce3-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4c0519" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1100" height="300" fill="#fff5f7"/>
  <rect width="1100" height="300" fill="url(#ce3-dots)"/>
  <rect x="0.5" y="0.5" width="1099" height="299" fill="none" stroke="#e11d48" stroke-opacity="0.35" stroke-width="1.5" rx="8"/>

  <!-- left: the letter editor -->
  <g filter="url(#ce3-soft)">
    <rect x="56" y="56" width="250" height="196" rx="10" fill="#ffffff" stroke="#fda4af" stroke-width="1.5"/>
  </g>
  <rect x="56" y="56" width="250" height="34" rx="10" fill="#ffe4ec"/>
  <rect x="56" y="78" width="250" height="12" fill="#ffe4ec"/>
  <circle cx="74" cy="73" r="5" fill="#f43f5e"/>
  <circle cx="90" cy="73" r="5" fill="#fda4af"/>
  <circle cx="106" cy="73" r="5" fill="#fecdd3"/>
  <text x="290" y="76" font-family="ui-monospace,monospace" font-size="10.5" fill="#9f1239" text-anchor="end">editor de carta</text>

  <g font-family="ui-monospace,monospace" font-size="10.5" fill="#9f1239">
    <rect x="72" y="102" width="218" height="34" rx="6" fill="#fff5f7" stroke="#fecdd3"/>
    <rect x="80" y="112" width="150" height="4" rx="2" fill="#fda4af"/>
    <rect x="80" y="121" width="110" height="4" rx="2" fill="#fecdd3"/>
    <text x="238" y="122">parágrafo</text>

    <rect x="72" y="142" width="218" height="40" rx="6" fill="#fff5f7" stroke="#fecdd3"/>
    <rect x="80" y="150" width="52" height="24" rx="4" fill="#fecdd3"/>
    <path d="M 84 170 l 10 -10 l 8 7 l 6 -5 l 10 8" stroke="#e11d48" stroke-width="1.5" fill="none"/>
    <circle cx="122" cy="156" r="3" fill="#e11d48"/>
    <text x="146" y="166">foto</text>

    <rect x="72" y="188" width="218" height="34" rx="6" fill="#fff5f7" stroke="#fecdd3"/>
    <g stroke="#e11d48" stroke-width="2" stroke-linecap="round">
      <line x1="82" y1="205" x2="82" y2="205"><animate attributeName="y1" values="205;199;205" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y2" values="205;211;205" dur="1.1s" repeatCount="indefinite"/></line>
      <line x1="90" y1="205" x2="90" y2="205"><animate attributeName="y1" values="205;202;205" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y2" values="205;208;205" dur="0.9s" repeatCount="indefinite"/></line>
      <line x1="98" y1="205" x2="98" y2="205"><animate attributeName="y1" values="205;197;205" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y2" values="205;213;205" dur="1.3s" repeatCount="indefinite"/></line>
      <line x1="106" y1="205" x2="106" y2="205"><animate attributeName="y1" values="205;201;205" dur="1.0s" repeatCount="indefinite"/><animate attributeName="y2" values="205;209;205" dur="1.0s" repeatCount="indefinite"/></line>
      <line x1="114" y1="205" x2="114" y2="205"><animate attributeName="y1" values="205;198;205" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y2" values="205;212;205" dur="1.2s" repeatCount="indefinite"/></line>
    </g>
    <text x="238" y="210">áudio</text>
  </g>

  <!-- wax seal -->
  <g>
    <circle cx="290" cy="252" r="20" fill="#d4a574"/>
    <circle cx="290" cy="252" r="20" fill="none" stroke="#a0713f" stroke-width="1" stroke-dasharray="3 3">
      <animateTransform attributeName="transform" type="rotate" from="0 290 252" to="360 290 252" dur="24s" repeatCount="indefinite"/>
    </circle>
    <path d="M 290 258 c -6 -4 -9 -8 -9 -11.5 a 5 5 0 0 1 9 -3 a 5 5 0 0 1 9 3 c 0 3.5 -3 7.5 -9 11.5 z" fill="#fff5f7"/>
  </g>

  <!-- right: identity + flow -->
  <text x="380" y="88" font-family="Georgia,serif" font-size="19" font-style="italic" fill="#d4a574">com muito afeto…</text>
  <text x="378" y="142" font-family="Georgia,'Times New Roman',serif" font-size="58" font-weight="bold" fill="#4c0519">Correio <tspan fill="#e11d48" font-style="italic">Elegante</tspan></text>
  <text x="380" y="174" font-family="ui-monospace,'Fira Code',monospace" font-size="14" fill="#701a35">cartas digitais com editor próprio, pagamento e QR</text>

  <g font-family="ui-monospace,'Fira Code',monospace" font-size="13" fill="#4c0519">
    <rect x="380" y="196" width="640" height="48" rx="8" fill="#ffffff" fill-opacity="0.6" stroke="#fecdd3"/>
    <text x="400" y="225">editor de blocos</text>
    <text x="556" y="225" fill="#e11d48">→</text>
    <text x="584" y="225">pix r$5</text>
    <text x="700" y="225" fill="#e11d48">→</text>
    <text x="728" y="225">qr impresso</text>
    <text x="876" y="225" fill="#e11d48">→</text>
    <text x="904" y="225">/card/:id</text>
  </g>
  <text x="382" y="270" font-family="ui-monospace,monospace" font-size="11.5" fill="#9f1239" opacity="0.75">react 19 · express 5 · prisma · stripe + pagbank · remotion</text>
</svg>
