<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 240" width="1080" height="240" role="img" aria-labelledby="arch-title">
  <title id="arch-title">Fluxo de Integração e Arquitetura — Correio Elegante</title>
  <defs>
    <linearGradient id="card-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5f6"/>
    </linearGradient>
    <radialGradient id="seal-rose" cx="35%" cy="30%" r="95%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="60%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </radialGradient>
    <radialGradient id="seal-gold" cx="35%" cy="30%" r="95%">
      <stop offset="0%" stop-color="#e8c9a0"/>
      <stop offset="60%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#a97a4a"/>
    </radialGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#be123c" flood-opacity="0.07"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#1f2937" flood-opacity="0.03"/>
    </filter>
    <path id="heart" d="M 0,-3.4 C -1.8,-6.6 -6,-5.2 -6,-0.6 C -6,3.4 0,7 0,7 C 0,7 6,3.4 6,-0.6 C 6,-5.2 1.8,-6.6 0,-3.4 Z"/>
    <path id="spark" d="M 0,-4.5 L 1.1,-1.1 L 4.5,0 L 1.1,1.1 L 0,4.5 L -1.1,1.1 L -4.5,0 L -1.1,-1.1 Z"/>
  </defs>

  <style>
    .serif  { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; }
    .sans   { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .hand   { font-family: 'Caveat', 'Segoe Script', 'Comic Sans MS', cursive; }

    .title {
      font-size: 17px; font-weight: 700; fill: #be123c;
      letter-spacing: 2.2px;
    }
    .subtitle { font-size: 15px; fill: #c18a58; }

    .seal-num {
      font-size: 10.5px; font-weight: 700; fill: #fffafb;
      font-family: Georgia, 'Times New Roman', serif;
    }
    .card-title { font-size: 12px; font-weight: 700; fill: #1f2937; }
    .card-desc  { font-size: 10.8px; font-weight: 500; fill: #6b7280; }
    .tag-text   { font-size: 10px; font-weight: 600; letter-spacing: 0.4px; }
    .tag-text-rose { fill: #be123c; }
    .tag-text-gold { fill: #92603a; }

    .conn { stroke: #f9a8b8; stroke-width: 1.3; opacity: 0.75; }

    /* Pulsing border glow — pure CSS, runs inside &lt;img&gt; */
    @keyframes glow-rose {
      0%, 100% { stroke: #e11d48; filter: drop-shadow(0 0 1px rgba(225,29,72,0.12)); }
      50%      { stroke: #fb7185; filter: drop-shadow(0 0 6px rgba(225,29,72,0.4)); }
    }
    @keyframes glow-gold {
      0%, 100% { stroke: #d4a574; filter: drop-shadow(0 0 1px rgba(212,165,116,0.12)); }
      50%      { stroke: #e8c9a0; filter: drop-shadow(0 0 6px rgba(212,165,116,0.45)); }
    }
    .card-rose { animation: glow-rose 4s ease-in-out infinite; }
    .card-gold { animation: glow-gold 4s ease-in-out infinite; }
    .delay-1 { animation-delay: -0.8s; }
    .delay-2 { animation-delay: -1.6s; }
    .delay-3 { animation-delay: -2.4s; }
    .delay-4 { animation-delay: -3.2s; }

    @keyframes float-spark {
      0%, 100% { transform: translate(0,0) scale(0.85) rotate(0deg); opacity: 0.35; }
      50%      { transform: translate(2px,-3px) scale(1.15) rotate(18deg); opacity: 0.95; }
    }
    .anim-spark { transform-box: fill-box; transform-origin: center; animation: float-spark 3.2s ease-in-out infinite; }

    @keyframes scan-line {
      0%, 100% { transform: translateY(1px); }
      50%      { transform: translateY(19px); }
    }
    .anim-scan { animation: scan-line 2.2s ease-in-out infinite; }

    @keyframes pulse-soft {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50%      { transform: scale(1.14); opacity: 0.55; }
    }
    .anim-pulse { transform-box: fill-box; transform-origin: center; animation: pulse-soft 2.6s ease-in-out infinite; }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14%      { transform: scale(1.25); }
      28%      { transform: scale(1); }
      42%      { transform: scale(1.18); }
      60%      { transform: scale(1); }
    }
    .anim-heart { transform-box: fill-box; transform-origin: center; animation: heartbeat 2.8s ease-in-out infinite; }
  </style>

  <!-- Paper background + delicate frame -->
  <rect width="100%" height="100%" fill="#fffafb"/>
  <rect x="8" y="8" width="1064" height="224" rx="22" fill="none" stroke="#fda4af" stroke-width="1" opacity="0.35"/>

  <!-- Header -->
  <g transform="translate(540,0)">
    <text x="0" y="36" text-anchor="middle" class="serif title">Fluxo de Integração e Arquitetura</text>
    <g transform="translate(-350,31) scale(0.9)"><use xlink:href="#heart" href="#heart" fill="#e11d48" opacity="0.8"/></g>
    <g transform="translate(350,31) scale(0.9)"><use xlink:href="#heart" href="#heart" fill="#d4a574" opacity="0.8"/></g>
    <text x="0" y="58" text-anchor="middle" class="hand subtitle">do primeiro clique ao coração de quem recebe</text>
  </g>

  <!-- ================= NODE 1 — Escrita ================= -->
  <g transform="translate(10,76)">
    <rect class="card-rose" width="180" height="118" rx="18" fill="url(#card-fill)" stroke="#e11d48" stroke-width="1.2" filter="url(#soft-shadow)"/>
    <circle cx="26" cy="28" r="14" fill="url(#seal-rose)"/>
    <circle cx="26" cy="28" r="10.5" fill="none" stroke="#fffafb" stroke-opacity="0.6" stroke-width="0.8" stroke-dasharray="2 2.4"/>
    <text x="26" y="32.5" text-anchor="middle" class="seal-num">01</text>
    <text x="48" y="32" class="serif card-title">Escrita &amp; Edição</text>
    <text x="18" y="58" class="sans card-desc">Editor SPA React 19</text>
    <text x="18" y="73" class="sans card-desc">Customização visual</text>
    <rect x="18" y="86" width="94" height="20" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="0.8"/>
    <text x="65" y="99.5" text-anchor="middle" class="sans tag-text tag-text-rose">Zustand Store</text>
    <g transform="translate(160,96)">
      <use xlink:href="#spark" href="#spark" fill="#d4a574" class="anim-spark"/>
    </g>
  </g>

  <!-- Connector 1 → 2 -->
  <path class="conn" d="M 194,135 L 226,135" fill="none"/>
  <path d="M 222,131.5 L 228,135 L 222,138.5" fill="none" stroke="#f9a8b8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <g opacity="0">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M 196,135 L 222,135"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.18;0.82;1" dur="2.4s" repeatCount="indefinite"/>
    <use xlink:href="#heart" href="#heart" fill="#e11d48" transform="scale(1.05)"/>
  </g>

  <!-- ================= NODE 2 — Processamento ================= -->
  <g transform="translate(230,76)">
    <rect class="card-gold delay-1" width="180" height="118" rx="18" fill="url(#card-fill)" stroke="#d4a574" stroke-width="1.2" filter="url(#soft-shadow)"/>
    <circle cx="26" cy="28" r="14" fill="url(#seal-gold)"/>
    <circle cx="26" cy="28" r="10.5" fill="none" stroke="#fffafb" stroke-opacity="0.6" stroke-width="0.8" stroke-dasharray="2 2.4"/>
    <text x="26" y="32.5" text-anchor="middle" class="seal-num">02</text>
    <text x="48" y="32" class="serif card-title">Processamento</text>
    <text x="18" y="58" class="sans card-desc">Express API Server</text>
    <text x="18" y="73" class="sans card-desc">Validação de tipos Zod</text>
    <rect x="18" y="86" width="96" height="20" rx="10" fill="#faf3ea" stroke="#e8c9a0" stroke-width="0.8"/>
    <text x="66" y="99.5" text-anchor="middle" class="sans tag-text tag-text-gold">Prisma Client</text>
    <text x="148" y="103" class="sans" font-size="11" font-weight="600" fill="#d4a574" opacity="0.85">&lt;/&gt;</text>
  </g>

  <!-- Connector 2 → 3 -->
  <path class="conn" d="M 414,135 L 446,135" fill="none"/>
  <path d="M 442,131.5 L 448,135 L 442,138.5" fill="none" stroke="#f9a8b8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <g opacity="0">
    <animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite" path="M 416,135 L 442,135"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.18;0.82;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    <use xlink:href="#heart" href="#heart" fill="#d4a574" transform="scale(1.05)"/>
  </g>

  <!-- ================= NODE 3 — Pagamentos ================= -->
  <g transform="translate(450,76)">
    <rect class="card-rose delay-2" width="180" height="118" rx="18" fill="url(#card-fill)" stroke="#e11d48" stroke-width="1.2" filter="url(#soft-shadow)"/>
    <circle cx="26" cy="28" r="14" fill="url(#seal-rose)"/>
    <circle cx="26" cy="28" r="10.5" fill="none" stroke="#fffafb" stroke-opacity="0.6" stroke-width="0.8" stroke-dasharray="2 2.4"/>
    <text x="26" y="32.5" text-anchor="middle" class="seal-num">03</text>
    <text x="48" y="32" class="serif card-title">Pagamentos</text>
    <text x="18" y="58" class="sans card-desc">Stripe &amp; Mercado Pago</text>
    <text x="18" y="73" class="sans card-desc">Pix dinâmico &amp; cartão</text>
    <rect x="18" y="86" width="100" height="20" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="0.8"/>
    <text x="68" y="99.5" text-anchor="middle" class="sans tag-text tag-text-rose">Sessão Segura</text>
    <g transform="translate(162,96)">
      <g class="anim-pulse">
        <circle r="7" fill="none" stroke="#d4a574" stroke-width="1.1"/>
        <circle r="2.2" fill="#d4a574" opacity="0.7"/>
      </g>
    </g>
  </g>

  <!-- Connector 3 → 4 -->
  <path class="conn" d="M 634,135 L 666,135" fill="none"/>
  <path d="M 662,131.5 L 668,135 L 662,138.5" fill="none" stroke="#f9a8b8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <g opacity="0">
    <animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M 636,135 L 662,135"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.18;0.82;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    <use xlink:href="#heart" href="#heart" fill="#e11d48" transform="scale(1.05)"/>
  </g>

  <!-- ================= NODE 4 — Webhook ================= -->
  <g transform="translate(670,76)">
    <rect class="card-gold delay-3" width="180" height="118" rx="18" fill="url(#card-fill)" stroke="#d4a574" stroke-width="1.2" filter="url(#soft-shadow)"/>
    <circle cx="26" cy="28" r="14" fill="url(#seal-gold)"/>
    <circle cx="26" cy="28" r="10.5" fill="none" stroke="#fffafb" stroke-opacity="0.6" stroke-width="0.8" stroke-dasharray="2 2.4"/>
    <text x="26" y="32.5" text-anchor="middle" class="seal-num">04</text>
    <text x="48" y="32" class="serif card-title">Webhook &amp; Ativar</text>
    <text x="18" y="58" class="sans card-desc">Retorno assíncrono</text>
    <text x="18" y="73" class="sans card-desc">Gravação no MongoDB</text>
    <rect x="18" y="86" width="110" height="20" rx="10" fill="#faf3ea" stroke="#e8c9a0" stroke-width="0.8"/>
    <text x="73" y="99.5" text-anchor="middle" class="sans tag-text tag-text-gold">Webhooks Ativos</text>
    <g transform="translate(162,96)">
      <g class="anim-pulse">
        <path d="M -5,-2 A 6,6 0 0 1 5,-2" fill="none" stroke="#d4a574" stroke-width="1.1" stroke-linecap="round"/>
        <path d="M -8,-6 A 10.5,10.5 0 0 1 8,-6" fill="none" stroke="#d4a574" stroke-width="1.1" stroke-linecap="round" opacity="0.6"/>
        <circle cy="1" r="1.8" fill="#d4a574"/>
      </g>
    </g>
  </g>

  <!-- Connector 4 → 5 -->
  <path class="conn" d="M 854,135 L 886,135" fill="none"/>
  <path d="M 882,131.5 L 888,135 L 882,138.5" fill="none" stroke="#f9a8b8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <g opacity="0">
    <animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite" path="M 856,135 L 882,135"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.18;0.82;1" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
    <use xlink:href="#heart" href="#heart" fill="#d4a574" transform="scale(1.05)"/>
  </g>

  <!-- ================= NODE 5 — Entrega ================= -->
  <g transform="translate(890,76)">
    <rect class="card-rose delay-4" width="180" height="118" rx="18" fill="url(#card-fill)" stroke="#e11d48" stroke-width="1.2" filter="url(#soft-shadow)"/>
    <circle cx="26" cy="28" r="14" fill="url(#seal-rose)"/>
    <circle cx="26" cy="28" r="10.5" fill="none" stroke="#fffafb" stroke-opacity="0.6" stroke-width="0.8" stroke-dasharray="2 2.4"/>
    <text x="26" y="32.5" text-anchor="middle" class="seal-num">05</text>
    <text x="48" y="32" class="serif card-title">Entrega &amp; Leitura</text>
    <text x="18" y="58" class="sans card-desc">QR Code de leitura</text>
    <text x="18" y="73" class="sans card-desc">Visualizador de cartas</text>
    <rect x="18" y="86" width="128" height="20" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="0.8"/>
    <text x="82" y="99.5" text-anchor="middle" class="sans tag-text tag-text-rose">Lenis Smooth Scroll</text>
    <g transform="translate(152,86)">
      <rect width="20" height="20" rx="3" fill="#fff5f6" stroke="#fda4af" stroke-width="0.8"/>
      <rect x="2" y="2" width="4.5" height="4.5" fill="#e11d48"/>
      <rect x="13.5" y="2" width="4.5" height="4.5" fill="#e11d48"/>
      <rect x="2" y="13.5" width="4.5" height="4.5" fill="#e11d48"/>
      <rect x="8.5" y="8.5" width="3" height="3" fill="#d4a574"/>
      <line x1="1" y1="1" x2="19" y2="1" stroke="#e11d48" stroke-width="0.8" class="anim-scan"/>
    </g>
  </g>

  <!-- Footer flourish -->
  <g>
    <path d="M 250,221 H 505" stroke="#f9a8b8" stroke-width="1" stroke-dasharray="1 6" stroke-linecap="round" opacity="0.5"/>
    <path d="M 575,221 H 830" stroke="#f9a8b8" stroke-width="1" stroke-dasharray="1 6" stroke-linecap="round" opacity="0.5"/>
    <g transform="translate(540,219) scale(0.9)">
      <use xlink:href="#heart" href="#heart" fill="#e11d48" class="anim-heart"/>
    </g>
  </g>
</svg>
