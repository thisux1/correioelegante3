  <path d="M106 352 L206 250" fill="none" stroke="#fda4af" stroke-width="8" stroke-linecap="round"/>
  <path d="M406 352 L306 250" fill="none" stroke="#fda4af" stroke-width="8" stroke-linecap="round"/>

  <!-- Selo Central de Cera -->
  <circle cx="256" cy="276" r="46" fill="#be123c"/>
  <circle cx="256" cy="276" r="40" fill="#e11d48"/>

  <!-- Monograma de Coração no Selo -->
  <path d="M256 292 C256 292 236 278 236 266 C236 258 242 252 250 252 C254 252 256 254 256 254 C256 254 258 252 262 252 C270 252 276 258 276 266 C276 278 256 292 256 292 Z" fill="#ffffff"/>
